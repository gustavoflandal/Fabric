services:
  mysql:
    image: mysql:8.0
    container_name: fabric-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: FIXGfLVQw9vNY4CxnCdzcz2
      MYSQL_DATABASE: fabric
      MYSQL_USER: fabric
      MYSQL_PASSWORD: pYKz4wg7GJjwVRv7IoFEkw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fabric-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fabric-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://fabric:pYKz4wg7GJjwVRv7IoFEkw@mysql:3306/fabric"
      JWT_SECRET: "99d18635296e305de5674beafbd502d0a23c1e2c1b39bd21a100497d3deb3064"
      JWT_REFRESH_SECRET: "bab03802fdfbd9da8cebe1b3370b26db1281e915699eb7515bdfefacc02b310a"
      PORT: 3005
      NODE_ENV: development
      OLLAMA_URL: "http://ollama:11434"
      CHROMA_HOST: "chromadb"
      CHROMA_PORT: "8000"
      ASSISTANT_DATABASE_URL: "mysql://fabric_assistente:lsei4tgbLRJxOvxjqZEyrRGI@mysql:3306/fabric"
    command: sh -c "npx prisma generate && npm run dev"
    ports:
      - "3005:3005"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Assistente de IA — Fase 1: `backend/scripts/ai-index-docs.ts` resolve
      # `docs/operacao` subindo dois níveis a partir de `backend/scripts`
      # (correto fora de container, onde `docs/` é irmã de `backend/`). Dentro
      # do container só `./backend` é montado em `/app`, então esse mesmo
      # caminho relativo aponta para `/docs/operacao` na raiz do filesystem do
      # container — sem este volume, `npm run ai:index-docs` falha com ENOENT
      # em qualquer ambiente Docker, não só nesta verificação.
      - ./docs/operacao:/docs/operacao
    depends_on:
      - mysql
    networks:
      - fabric-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fabric-frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: "http://backend:3005"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fabric-network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  fabric-network:
    driver: bridge
